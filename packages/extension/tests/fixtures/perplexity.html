<main>
  <div data-testid="query-text">What causes the northern lights?</div>
  <div data-testid="answer-content">
    The northern lights are caused by charged particles from the sun colliding with gases in Earth's atmosphere near
    the poles, where the planet's magnetic field funnels them in, producing glowing displays of green, pink, and
    purple light.
  </div>
</main>
