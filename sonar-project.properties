# SonarCloud configuration. Uses the default key/org SonarCloud assigns when
# importing a GitHub repo (<github-org>_<repo-name> / <github-org>) - verify
# these match what's actually created at https://sonarcloud.io before relying
# on the sonarcloud.yml workflow; update if the project was created under a
# different key.
sonar.projectKey=medaharrat_treco
sonar.organization=medaharrat

sonar.projectName=Treco
sonar.sources=packages/core/src,packages/extension/src
sonar.tests=packages/core/tests,packages/extension/tests
sonar.exclusions=**/dist/**,**/node_modules/**,**/*.d.ts
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# No coverage report is wired in yet (no coverage tool is installed - see
# CONTRIBUTING.md). Static analysis (code smells, duplication, security
# hotspots) still runs without it. To add coverage later: install
# @vitest/coverage-v8, run `vitest run --coverage`, and set
# sonar.javascript.lcov.reportPaths to the generated lcov.info file(s).
