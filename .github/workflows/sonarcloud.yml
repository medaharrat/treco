# Static analysis via SonarCloud (sonarcloud.io - free for public repos).
#
# Requires a repo secret named SONAR_TOKEN (Settings -> Secrets and variables
# -> Actions -> New repository secret), generated from a SonarCloud project
# imported from this GitHub repo - see sonar-project.properties for the
# project key/organization this workflow expects, and update that file if
# your SonarCloud project uses different ones. Until SONAR_TOKEN is set, this
# workflow's job is skipped rather than failing.
name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'medaharrat' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud wants full history for blame/new-code analysis

      - name: Check SONAR_TOKEN is configured
        id: check-token
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN secret is not set - skipping SonarCloud scan. See this workflow's header comment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SonarCloud Scan
        if: steps.check-token.outputs.configured == 'true'
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
