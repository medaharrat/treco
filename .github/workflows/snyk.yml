# Dependency vulnerability scanning via Snyk.
#
# Requires a repo secret named SNYK_TOKEN (Settings -> Secrets and variables ->
# Actions -> New repository secret), from https://app.snyk.io/account. Until
# that secret is set, this workflow's job is skipped rather than failing -
# a missing optional integration shouldn't block CI.
name: Snyk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk dependency scan
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'medaharrat' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check SNYK_TOKEN is configured
        id: check-token
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "SNYK_TOKEN secret is not set - skipping Snyk scan. See this workflow's header comment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.check-token.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.check-token.outputs.configured == 'true'
        run: npm ci

      - name: Run Snyk to check for known vulnerabilities
        if: steps.check-token.outputs.configured == 'true'
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to GitHub code scanning
        if: steps.check-token.outputs.configured == 'true'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: snyk.sarif
